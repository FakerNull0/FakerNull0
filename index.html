<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FakerNull0 — System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot" class="boot">
    <div class="boot-logo">FakerNull0</div>
    <div class="boot-bar"><span></span></div>
</div>

<div id="desktop" class="desktop">
    <div id="desktop-icons" class="desktop-icons"></div>
</div>

<div id="start-menu" class="start-menu hidden"></div>

<div class="taskbar">
    <button id="start-btn" class="start-btn" aria-label="Start">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="0" y="0" width="7" height="7" rx="1.5"/>
            <rect x="9" y="0" width="7" height="7" rx="1.5"/>
            <rect x="0" y="9" width="7" height="7" rx="1.5"/>
            <rect x="9" y="9" width="7" height="7" rx="1.5"/>
        </svg>
    </button>
    <div id="taskbar-items" class="taskbar-items"></div>
    <div class="clock">
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date" id="clock-date">—</div>
    </div>
</div>

<script src="os.js"></script>
</body>
</html>
